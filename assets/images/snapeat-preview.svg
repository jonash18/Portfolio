<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">SnapEat food scanning interface preview</title>
  <desc id="desc">A green food health dashboard with a scan panel and nutrition cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f5132"/>
      <stop offset="1" stop-color="#8bc34a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#062718" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="#eef7ef"/>
  <rect width="1200" height="112" fill="url(#bg)"/>
  <text x="72" y="70" fill="#fff" font-family="Arial, sans-serif" font-size="38" font-weight="700">SnapEat</text>
  <text x="950" y="67" fill="#e8f6e9" font-family="Arial, sans-serif" font-size="18">HEALTH DASHBOARD</text>
  <rect x="64" y="158" width="700" height="510" rx="28" fill="#fff" filter="url(#shadow)"/>
  <text x="108" y="222" fill="#123c28" font-family="Arial, sans-serif" font-size="30" font-weight="700">Scan your food</text>
  <text x="108" y="257" fill="#6c8174" font-family="Arial, sans-serif" font-size="17">Capture an item to see its nutrition profile.</text>
  <rect x="108" y="294" width="612" height="252" rx="20" fill="#dcefe1"/>
  <circle cx="414" cy="415" r="62" fill="#fff" opacity=".94"/>
  <path d="M383 415h62M414 384v62" stroke="#168653" stroke-width="12" stroke-linecap="round"/>
  <circle cx="414" cy="415" r="88" fill="none" stroke="#70bd83" stroke-width="5" stroke-dasharray="12 14"/>
  <text x="327" y="596" fill="#168653" font-family="Arial, sans-serif" font-size="18" font-weight="700">OPEN CAMERA</text>
  <rect x="812" y="158" width="324" height="156" rx="24" fill="#0f5132"/>
  <text x="850" y="207" fill="#bfe7c8" font-family="Arial, sans-serif" font-size="16">TODAY'S HEALTH SCORE</text>
  <text x="850" y="275" fill="#fff" font-family="Arial, sans-serif" font-size="58" font-weight="700">8.6<span font-size="22"> / 10</span></text>
  <rect x="812" y="344" width="324" height="324" rx="24" fill="#fff" filter="url(#shadow)"/>
  <text x="850" y="395" fill="#123c28" font-family="Arial, sans-serif" font-size="23" font-weight="700">Nutrition summary</text>
  <text x="850" y="448" fill="#6c8174" font-family="Arial, sans-serif" font-size="17">Calories</text><text x="1050" y="448" fill="#123c28" font-family="Arial, sans-serif" font-size="18" font-weight="700">420 kcal</text>
  <text x="850" y="495" fill="#6c8174" font-family="Arial, sans-serif" font-size="17">Protein</text><text x="1050" y="495" fill="#123c28" font-family="Arial, sans-serif" font-size="18" font-weight="700">24 g</text>
  <text x="850" y="542" fill="#6c8174" font-family="Arial, sans-serif" font-size="17">Status</text><text x="1050" y="542" fill="#168653" font-family="Arial, sans-serif" font-size="18" font-weight="700">Healthy</text>
  <rect x="850" y="586" width="224" height="12" rx="6" fill="#dcefe1"/><rect x="850" y="586" width="178" height="12" rx="6" fill="#55ad70"/>
</svg>
