<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">MLFQ CPU scheduling simulator preview</title>
  <desc id="desc">A desktop scheduler interface with process inputs, logs, and a Gantt chart.</desc>
  <rect width="1200" height="750" fill="#e8eef0"/>
  <rect x="55" y="45" width="1090" height="660" rx="18" fill="#f8fafb" stroke="#b6c4c7" stroke-width="4"/>
  <rect x="55" y="45" width="1090" height="74" rx="18" fill="#054342"/>
  <rect x="55" y="92" width="1090" height="27" fill="#054342"/>
  <text x="92" y="91" fill="#fff" font-family="Arial, sans-serif" font-size="29" font-weight="700">MLFQ Scheduler</text>
  <rect x="90" y="153" width="1020" height="145" rx="12" fill="#d4dfe1"/>
  <text x="118" y="193" fill="#052011" font-family="Arial, sans-serif" font-size="20" font-weight="700">Add Multiple Processes</text>
  <text x="118" y="232" fill="#67797b" font-family="Arial, sans-serif" font-size="16">PID, Burst, Arrival, Priority</text>
  <rect x="118" y="247" width="620" height="30" rx="5" fill="#fff" stroke="#b6c4c7"/>
  <text x="135" y="268" fill="#67797b" font-family="monospace" font-size="15">1, 8, 0, 2&#10;</text>
  <rect x="770" y="235" width="176" height="45" rx="7" fill="#054342"/><text x="803" y="264" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Add Processes</text>
  <rect x="90" y="330" width="1020" height="145" rx="12" fill="#fff" stroke="#b6c4c7" stroke-width="2"/>
  <text x="118" y="368" fill="#052011" font-family="Arial, sans-serif" font-size="20" font-weight="700">Scheduler Log</text>
  <text x="118" y="405" fill="#67797b" font-family="monospace" font-size="16">Time 0: Process P1 is running in Queue 0</text>
  <text x="118" y="435" fill="#67797b" font-family="monospace" font-size="16">Time 4: Process P1 moved to Queue 1</text>
  <rect x="90" y="507" width="1020" height="145" rx="12" fill="#fff" stroke="#b6c4c7" stroke-width="2"/>
  <text x="118" y="545" fill="#052011" font-family="Arial, sans-serif" font-size="20" font-weight="700">Gantt Chart</text>
  <rect x="118" y="570" width="240" height="48" fill="#0f7770"/><rect x="358" y="570" width="320" height="48" fill="#679a8d"/><rect x="678" y="570" width="185" height="48" fill="#b6c4c7"/><rect x="863" y="570" width="160" height="48" fill="#67797b"/>
  <text x="218" y="601" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700">P1 · Q0</text><text x="518" y="601" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700">P2 · Q1</text><text x="770" y="601" fill="#052011" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700">P3</text>
</svg>
